name: Public source boundary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify source package
        run: python3 scripts/verify_public_snapshot.py
