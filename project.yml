name: PersonalBrowser
options:
  bundleIdPrefix: org.libertyequalitydata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2026.10.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  PersonalBrowser:
    type: application
    platform: iOS
    sources:
      - path: Browser/Sources
      - path: Browser/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.libertyequalitydata.personalbrowser
        PRODUCT_NAME: PersonalBrowser
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Browser/Supporting/Info.plist
      properties:
        BrowserAddToHomeScreenEnabled: false
        BrowserPasskeyAuthorizationEnabled: false
        CFBundleDisplayName: Personal Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: org.libertyequalitydata.personalbrowser.web
            CFBundleURLSchemes:
              - http
              - https
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSSpeechRecognitionUsageDescription: Personal Browser transcribes audio only when you explicitly request it. Recognition stays on this device when supported.
        UIBackgroundModes:
          - audio
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - PersonalBrowserTests
  PersonalBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Browser/Tests
    dependencies:
      - target: PersonalBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.libertyequalitydata.personalbrowser.tests
        GENERATE_INFOPLIST_FILE: true
